[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pagequay"
version = "1.0.1"
description = "Private persistent browser gateway for macOS"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "playwright>=1.51,<2",
  "jinja2>=3.1.6,<4", "python-multipart>=0.0.20,<1",
  "websockets>=15,<18",
  "argon2-cffi>=23.1,<26", "beautifulsoup4>=4.13,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
pq = "pagequay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pagequay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: real Chromium integration (PQ_BROWSER_TESTS=1)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
